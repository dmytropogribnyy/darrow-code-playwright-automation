name: Full browser suite

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-browser-suite
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Bootstrap missing visual baselines
        if: ${{ failure() && hashFiles('tests/visual/home.visual.spec.ts-snapshots/*.png') == '' }}
        run: |
          npx playwright test tests/visual --project=chromium --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/home.visual.spec.ts-snapshots/*.png
          git commit -m "Bootstrap visual baselines"
          git push origin HEAD:main
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-nightly-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
